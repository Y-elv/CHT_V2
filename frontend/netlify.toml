[[redirects]]
  from = "/api/*"
  to = "https://chtv2-bn.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://chtv2-bn.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://chtv2-bn.onrender.com/socket.io/:splat"
  status = 200
  force = true
